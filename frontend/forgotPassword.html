<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reset Password | My Taskflow</title>
  <link rel="stylesheet" href="style.css">
</head>
<body onload="prefillResetEmail()">
  <div class="app-title">My Taskflow</div>

  <main class="page">
    <div class="container">
      <div class="panel">
        <div class="panel-header">
          <h2>Reset Password</h2>
          <p class="subtitle">Enter your email and set a new password.</p>
        </div>

        <form class="form-grid" onsubmit="resetPassword(); return false;">
          <label class="field">
            <span class="label">Email</span>
            <input type="email" id="resetEmail" placeholder="you@example.com" required>
          </label>

          <label class="field">
            <span class="label">New password</span>
            <input type="password" id="newPassword" placeholder="New password" required>
          </label>

          <label class="field">
            <span class="label">Confirm new password</span>
            <input type="password" id="confirmPassword" placeholder="Confirm new password" required>
          </label>

          <div class="actions">
            <button type="submit">Save new password</button>
            <button type="button" class="secondary" onclick="window.location.href='login.html'">Back to login</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <script src="app.js?v=2"></script>
</body>
</html>
